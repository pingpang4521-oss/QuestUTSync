name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Run Tests
      run: cargo test -- --nocapture

    - name: Build Release
      run: cargo build --release

    - name: Stage Distribution
      run: |
        New-Item -ItemType Directory -Force dist | Out-Null
        Copy-Item target\release\tracker_setup_lite.exe dist\
        Copy-Item lib\openvr_api.dll dist\
        Copy-Item lib\openvr_api.LICENSE.txt dist\
        Copy-Item Run-QuestUTSync.bat dist\

    - name: Run Self-Test
      run: .\dist\tracker_setup_lite.exe --selftest

    - name: Archive Distribution
      run: Compress-Archive -Path dist\* -DestinationPath QuestUTSync-win-x64.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuestUTSync-win-x64
        path: QuestUTSync-win-x64.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: QuestUTSync-win-x64

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: QuestUTSync-win-x64.zip
