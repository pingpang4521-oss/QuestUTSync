name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore QuestUTSync.csproj

    - name: Build and Publish
      run: dotnet publish -c Release -r win-x64 --no-self-contained -o dist QuestUTSync.csproj

    - name: Copy Launcher Script
      run: Copy-Item Run-QuestUTSync.bat dist\Run-QuestUTSync.bat

    - name: Run Self-Test
      run: .\dist\tracker_setup_lite.exe --selftest

    - name: Archive Distribution
      run: Compress-Archive -Path dist\* -DestinationPath QuestUTSync-win-x64.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuestUTSync-win-x64
        path: QuestUTSync-win-x64.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: QuestUTSync-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
