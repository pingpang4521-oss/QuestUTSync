name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Publish
      run: dotnet publish -c Release -o dist QuestUTSync.csproj

    - name: Copy Launcher Script and Third-Party Notice
      run: |
        Copy-Item Run-QuestUTSync.bat dist\
        Copy-Item lib\openvr_api.LICENSE.txt dist\

    - name: Run Self-Test
      run: .\dist\tracker_setup_lite.exe --selftest

    - name: Archive Distribution
      run: Compress-Archive -Path dist\* -DestinationPath QuestUTSync-win-x64.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuestUTSync-win-x64
        path: QuestUTSync-win-x64.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: QuestUTSync-win-x64

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: QuestUTSync-win-x64.zip
