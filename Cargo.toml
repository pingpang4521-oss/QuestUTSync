[package]
name = "questutsync"
version = "2.0.0"
edition = "2021"
authors = ["pingpang4521-oss"]
description = "Automatic Vive Ultimate Tracker to Meta Quest playspace synchronizer for SteamVR"
license = "MIT"
repository = "https://github.com/pingpang4521-oss/QuestUTSync"

[[bin]]
name = "tracker_setup_lite"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
glam = "0.29"
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
